name: Backtest 2

# Branche "backtest2" uniquement. Aucun secret : ne peut ni trader ni lire les cles.
on:
  push:
    branches: [backtest2]
    paths: ["backtest/backtest2.py", "strategie.py", "backtest/backtest.py", ".github/workflows/backtest2.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest2
  cancel-in-progress: true

jobs:
  backtest2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: backtest2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Dependances (versions et empreintes verrouillees)
        run: pip install --require-hashes --no-deps -r backtest/requirements.txt
      - name: Donnees Binance + backtest 2
        run: |
          cd backtest
          python backtest2.py --fetch --out resultats_backtest2.md
          cat resultats_backtest2.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer le rapport
        run: |
          git config user.name  "scalpradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest/resultats_backtest2.md backtest/resultats_backtest2.json
          git commit -m "backtest2: resultats $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
          git push origin HEAD:backtest2
