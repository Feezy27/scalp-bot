name: Backtest

# Se declenche uniquement sur la branche "backtest". Aucun secret utilise :
# ce workflow ne peut ni trader ni lire les cles.
on:
  push:
    branches: [backtest]
    paths: ["backtest/backtest.py", "backtest/requirements.txt", ".github/workflows/backtest.yml"]
  workflow_dispatch:

permissions:
  contents: write   # pour enregistrer le rapport sur la branche backtest

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: backtest
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Dependances (versions et empreintes verrouillees)
        run: pip install --require-hashes --no-deps -r backtest/requirements.txt
      - name: Donnees Binance + backtest
        run: |
          cd backtest
          python backtest.py --fetch --out resultats_backtest.md
          cat resultats_backtest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer le rapport
        run: |
          git config user.name  "scalpradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest/resultats_backtest.md backtest/resultats_backtest.json
          git commit -m "backtest: resultats $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
          git push origin HEAD:backtest
