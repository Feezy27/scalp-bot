name: ScalpRadar AutoTrade

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # toutes les 15 min, decale pour eviter la cohue de :00
  workflow_dispatch:                 # lancement manuel (onglet Actions)

# Pas de declencheur pull_request : personne d'exterieur ne peut faire tourner
# ce workflow avec les secrets.

permissions: {}                      # aucun droit par defaut

concurrency:
  group: autotrade                   # jamais deux executions en meme temps
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write                # uniquement pour sauvegarder l'etat chiffre
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          persist-credentials: false   # le jeton GitHub n'est pas laisse sur le disque pendant le bot

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Dependances (versions et empreintes verrouillees)
        run: pip install --quiet --require-hashes --no-deps -r requirements.txt

      - name: Tests de securite (si un seul echoue, le bot ne tourne pas)
        run: TEST_DIR="$RUNNER_TEMP" python tests/test_bot.py > /dev/null

      - name: Bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINGX_API_KEY:    ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
        run: python autotrade.py

      - name: Sauvegarde de l'etat chiffre
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "scalpradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add etat.chiffre
          git diff --staged --quiet && exit 0
          git commit -q -m "etat $(date -u '+%Y-%m-%d %H:%M')"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          for i in 1 2 3; do
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" pull -q --rebase origin main && \
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "Sauvegarde impossible (sera retentee au prochain passage)"
